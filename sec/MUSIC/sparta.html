<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="/tech/magixa_favicon.ico" />
    <link rel="stylesheet" href="/tech/start.css" />
    <link rel="stylesheet" href="./music.css" />
    <title>KonaloboWorld! - Music - Sparta</title>
    <link rel="stylesheet" href="/tech/custom_plyr.css" />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.8.5/plyr.css" />

    <script src="/tech/js/i18n.js"></script>
    <script src="/tech/js/component_loader.js"></script>
  </head>
  <body>
    <header
      class="up_panel_bg"
      style="z-index: 100000"
      data-include="/tech/headers/header_music.html"
    ></header>
    <main class="music_container">
      <section class="music_site_sec">
        <h1 class="sec_heading" data-i18n="music_wel_sparta">
          MUSIC_WEL_SPARTA
        </h1>
        <p class="sec_text" data-i18n="music_wel2_sparta">MUSIC_WEL2_SPARTA</p>
      </section>
      <section class="music_site_sec">
        <p class="sec_text" data-i18n="music_wel_sparta">MUSIC_WEL_SPARTA</p>
        <ul class="ul_track" data-category="sparta"></ul>
      </section>
      <section class="music_site_sec">
        <p class="sec_text">Sparta Remixes</p>
        <ul class="ul_track" data-category="sparta_remixes"></ul>
      </section>
      <section class="music_site_sec">
        <p class="sec_text" data-i18n="music_wel_sparta_extra">
          MUSIC_WEL_SPARTA_EXTRA
        </p>
        <ul class="ul_track" data-category="sparta_extra"></ul>
      </section>
      <section class="music_site_sec">
        <p class="sec_text">Custom Bases</p>
        <ul class="ul_track" data-category="sparta_custom"></ul>
      </section>
    </main>
    <script src="https://cdn.plyr.io/3.8.5/plyr.js"></script>
    <script src="/tech/js/music_loader.js"></script>
