<!doctype html>
<html>
  <head>

        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .window {
        background: linear-gradient(#c1d6f8, #8cbcf9);

        margin: 0;
      }
      .out_info_link {

        color: #003380;

        text-decoration: none;

  <body>
    <div class="window">
